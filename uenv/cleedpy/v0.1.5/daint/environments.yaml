gcc-env:
  compiler:
    - toolchain: gcc
      spec: gcc@13
  mpi:
    spec: cray-mpich@8.1.30
    gpu: null
  unify: true
  specs:
    - python@3.10
    - py-ase
    - py-click
    - py-jinja2
    - py-matplotlib
    - py-numpy
    - py-pydantic
    - py-pyyaml
    - py-scipy
    - py-typer
    - py-cleedpy@0.1.5
  views:
    default:
      link: all
      uenv:
        add_compilers: true
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]
          PATH: [bin]
